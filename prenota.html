<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SuperMovies - Archimeopoli </title>
    <link rel="stylesheet" href="css/style.css">
</head>
</head>
<body>
    <div>
        <header>
            <h1> SuperMovies </h1>
            <nav>
                <ul>
                    <li><a href="index.html"> Home </a></li>
                    <li><a href="programmazione.html"> Programmazione </a></li>
                    <li><a href="prenota.html"> Prenota </a></li>
                    <li><a href="contatti.html"> Contatti </a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2> Modulo di Prenotazione </h2>
            <section>
                <form>
                    <label for="nome" id="nome"> Nome </label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email" id="email"> Email </label>
                    <input type="email" id="email" name="email" required>

                    <label for="data" id="data"> Data </label>
                    <input type="date" id="data" name="data" required>

                    <label for="film" id="film"> Film </label>
                    <select name="film" id="film">
                        <option value="film1"> Quando Evadi le Tasse </option>
                        <option value="film2"> Meow Meow </option>
                        <option value="film3"> Le Bizzarre Avventure di Jimmy </option>
                    </select>

                    <legend> Seleziona il tipo di biglietto: </legend>
                    
                    <label for="intero" id="intero"> Intero </label>
                    <input type="radio" id="intero" name="intero" value="intero">

                    <label for="ridotto" id="ridotto"> Ridotto </label>
                    <input type="radio" id="ridotto" name="ridotto" value="ridotto">

                    <label for="posti"> Numero di Posti </label>
                    <input type="number" id="posti" name="posti" min="1" max="10" required>

                    <input type="submit" id="invio" name="invio">
                </form>
            </section>
        </main>

        <footer>
            <p> SuperMovies - Archimeopoli </p>
        </footer>
    </div>
</body>
</html>
